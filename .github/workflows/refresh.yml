name: Refresh slate data
on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (leave blank to auto-detect)"
        required: false
  push:
    paths:
      - "data/overrides.json"
      - "data/picks.json"
      - "scripts/**"
  schedule:
    # Daily 14:10 UTC, plus extra runs ~1-2h before Sun 1pm ET and Thu/Mon night kickoffs
    - cron: "10 14 * * *"
    - cron: "40 15 * * 0"
    - cron: "40 21 * * 1,4"
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build all upcoming DraftKings Classic slates
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then python3 scripts/build_data.py --week "${{ github.event.inputs.week }}";
          else python3 scripts/build_data.py; fi
      - name: Commit
        run: |
          git config user.name "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh slate data"
          git pull --rebase origin main
          git push
